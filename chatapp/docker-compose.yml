services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - AWS_REGION=eu-west-1
      - AWS_ACCESS_KEY_ID=dummy
      - AWS_SECRET_ACCESS_KEY=dummysecret
      - AWS_DYNAMODB_ENDPOINT=http://dynamodb-local:8000
      - AWS_S3_ENDPOINT=http://minio:9000
      - AWS_S3_BUCKET_NAME=chatapp-profiles
    depends_on:
      - dynamodb-local
      - minio

  dynamodb-local:
    image: amazon/dynamodb-local
    ports:
      - "8000:8000"

  minio:
    image: minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=dummy
      - MINIO_ROOT_PASSWORD=dummysecret
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data

volumes:
  minio-data: