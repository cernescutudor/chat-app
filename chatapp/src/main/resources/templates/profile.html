<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>Profile – ChatApp</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
	<style>
		body {
			min-height: 100vh;
			background:
				radial-gradient(circle at top left, rgba(13, 110, 253, 0.18), transparent 32%),
				radial-gradient(circle at bottom right, rgba(32, 201, 151, 0.18), transparent 28%),
				#f4f7fb;
		}

		.profile-shell {
			min-height: 100vh;
		}

		.profile-card {
			max-width: 760px;
			border: 0;
			border-radius: 24px;
			overflow: hidden;
		}

		.profile-hero {
			background: linear-gradient(135deg, #0d6efd, #1b9aaa);
			color: white;
		}

		.avatar {
			width: 156px;
			height: 156px;
			border-radius: 50%;
			object-fit: cover;
			border: 6px solid rgba(255, 255, 255, 0.85);
			background: rgba(255, 255, 255, 0.2);
		}

		.avatar-placeholder {
			width: 156px;
			height: 156px;
			border-radius: 50%;
			display: grid;
			place-items: center;
			font-size: 3rem;
			font-weight: 700;
			color: rgba(255, 255, 255, 0.9);
			border: 6px solid rgba(255, 255, 255, 0.85);
			background: rgba(255, 255, 255, 0.12);
		}
	</style>
</head>
<body>
<div class="container profile-shell d-flex align-items-center justify-content-center py-5">
	<div class="card shadow-lg profile-card w-100">
		<div class="profile-hero p-4 p-md-5">
			<div class="d-flex flex-column flex-md-row align-items-center gap-4">
				<div>
					<img th:if="${not #strings.isEmpty(currentUser.profilePictureUrl)}"
						 th:src="${currentUser.profilePictureUrl}"
						 alt="Profile picture"
						 class="avatar">
					<div th:if="${#strings.isEmpty(currentUser.profilePictureUrl)}" class="avatar-placeholder">
						<span th:text="${currentUser.username.substring(0,1).toUpperCase()}">U</span>
					</div>
				</div>

				<div class="text-center text-md-start">
					<div class="small text-uppercase opacity-75">Profile</div>
					<h1 class="h2 mb-1" th:text="${currentUser.username}">Username</h1>
					<div class="opacity-75" th:text="${currentUser.email}">you@example.com</div>
				</div>
			</div>
		</div>

		<div class="card-body p-4 p-md-5 bg-white">
			<div th:if="${param.uploaded}" class="alert alert-success">
				Profile picture uploaded.
			</div>
			<div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

			<div class="row g-4 align-items-start">
				<div class="col-md-6">
					<h2 class="h5 mb-3">Upload a new picture</h2>
					<p class="text-muted mb-4">
						Choose an image file to replace your current profile picture.
					</p>

					<form th:action="@{/profile/picture}" method="post" enctype="multipart/form-data">
						<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
						<div class="mb-3">
							<label for="file" class="form-label">Image file</label>
							<input type="file" class="form-control" id="file" name="file" accept="image/*" required>
						</div>
						<button type="submit" class="btn btn-primary">Upload picture</button>
						<a th:href="@{/chat}" class="btn btn-link">Back to chat</a>
					</form>
				</div>

				<div class="col-md-6">
					<h2 class="h5 mb-3">Current picture</h2>
					<div class="border rounded-4 p-4 bg-light text-center">
						<img th:if="${not #strings.isEmpty(currentUser.profilePictureUrl)}"
							 th:src="${currentUser.profilePictureUrl}"
							 alt="Current profile picture"
							 class="img-fluid rounded-4 shadow-sm"
							 style="max-height: 280px; object-fit: cover;">
						<div th:if="${#strings.isEmpty(currentUser.profilePictureUrl)}" class="text-muted py-5">
							No profile picture yet.
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
</div>
</body>
</html>
