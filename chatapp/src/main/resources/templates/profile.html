<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>Profile – ChatApp</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
	<link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="auth-body bg-shapes">
	<div class="card auth-card" style="max-width: 600px; padding: 2rem;">
		
		<div style="display: flex; flex-direction: column; align-items: center; gap: 1rem; margin-bottom: 2rem;">
			<div style="position: relative;">
				<img th:if="${not #strings.isEmpty(currentUser.profilePictureUrl)}"
					 th:src="${currentUser.profilePictureUrl}"
					 alt="Profile picture"
					 style="width: 120px; height: 120px; border-radius: 50%; object-fit: cover; border: 4px solid var(--accent); background: rgba(255,255,255,0.1);">
				<div th:if="${#strings.isEmpty(currentUser.profilePictureUrl)}" 
					 style="width: 120px; height: 120px; border-radius: 50%; display: grid; place-items: center; font-size: 3rem; font-weight: 700; color: var(--text); border: 4px solid var(--accent); background: rgba(255,255,255,0.1);">
					<span th:text="${currentUser.username.substring(0,1).toUpperCase()}">U</span>
				</div>
			</div>
			
			<div style="text-align: center;">
				<div style="font-size: 0.8rem; text-transform: uppercase; color: var(--text-muted); letter-spacing: 0.05em; font-family: 'DM Sans', sans-serif;">Profile</div>
				<h2 style="margin: 0.2rem 0; font-family: 'Sora', sans-serif;" th:text="${currentUser.username}">Username</h2>
				<div style="color: var(--text-muted); font-size: 0.95rem;" th:text="${currentUser.email}">you@example.com</div>
			</div>
		</div>

		<div th:if="${param.uploaded}" class="alert alert-success">Profile picture uploaded.</div>
		<div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

		<div style="margin-top: 2rem; background: rgba(255,255,255,0.03); padding: 1.5rem; border-radius: 12px; border: 1px solid var(--border);">
			<h3 style="font-family: 'Sora', sans-serif; font-size: 1.1rem; margin-bottom: 0.5rem; color: var(--text);">Upload a new picture</h3>
			<p style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 1.25rem;">Choose an image file to replace your current profile picture.</p>

			<form th:action="@{/profile/picture}" method="post" enctype="multipart/form-data">
				<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
				<div class="form-group">
					<input type="file" id="file" name="file" accept="image/*" required>
				</div>
				<button type="submit" class="btn-primary">Upload picture</button>
			</form>
		</div>

		<div style="margin-top: 1.5rem; text-align: center;">
			<a th:href="@{/chat}" class="btn-link">Back to chat</a>
		</div>
	</div>
</body>
</html>
