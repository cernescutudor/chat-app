<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login – ChatApp</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<div class="container d-flex justify-content-center align-items-center min-vh-100">
    <div class="card shadow" style="width: 100%; max-width: 400px;">
        <div class="card-body p-4">
            <h4 class="card-title text-center mb-4">Welcome to ChatApp</h4>

            <!-- Error message from Spring Security -->
            <div th:if="${param.error}" class="alert alert-danger">
                Invalid email or password.
            </div>

            <!-- Success message after registration -->
            <div th:if="${param.registered}" class="alert alert-success">
                Account created! Please log in.
            </div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label for="username" class="form-label">Email</label>
                    <input type="email" class="form-control" id="username"
                           name="username" placeholder="you@example.com" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password"
                           name="password" placeholder="••••••••" required>
                </div>
                <div class="d-grid">
                    <button type="submit" class="btn btn-primary">Sign In</button>
                </div>
            </form>

            <hr>
            <p class="text-center mb-0">
                Don't have an account?
                <a th:href="@{/register}">Register</a>
            </p>
        </div>
    </div>
</div>

</body>
</html>
