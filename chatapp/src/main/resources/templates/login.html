<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login – ChatApp</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="auth-body bg-shapes">
    <div class="card auth-card">
        <div class="brand">
            <div class="brand-icon">💬</div>
            <span class="brand-name">ChatApp</span>
        </div>
        <h2>Welcome back</h2>
        <p class="subtitle">Sign in to continue to your conversations</p>
        <div th:if="${param.error}" class="alert alert-danger">Invalid email or password. Please try again.</div>
        <div th:if="${param.registered}" class="alert alert-success">Account created! You can now sign in.</div>
        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label for="username">Email</label>
                <input type="email" id="username" name="username" placeholder="you@example.com" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-primary">Sign In</button>
        </form>
        <div class="divider">or</div>
        <p class="footer-link">Don't have an account? <a th:href="@{/register}">Create one</a></p>
    </div>
</body>
</html>
