<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Chat – ChatApp</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <style>
        body {
            height: 100vh;
            overflow: hidden;
        }

        #messages {
            height: calc(100vh - 220px);
            overflow-y: auto;
            background: #f8f9fa;
            border-radius: 8px;
            padding: 1rem;
        }

        .message-row {
            display: flex;
            align-items: flex-start;
            gap: 0.6rem;
            margin-bottom: 0.25rem;
        }

        .message-row.mine {
            justify-content: flex-end;
        }

        .message-row.theirs {
            justify-content: flex-start;
        }

        .message-row.continued.mine {
            padding-right: 2.1rem;
            margin-top: -0.1rem;
        }

        .message-row.continued.theirs {
            padding-left: 2.1rem;
            margin-top: -0.1rem;
        }

        .message-meta {
            font-size: 0.75rem;
            line-height: 1;
            margin-bottom: 0.25rem;
            opacity: 0.78;
        }

        .message-avatar {
            width: 34px;
            height: 34px;
            min-width: 34px;
            border-radius: 50%;
            object-fit: cover;
            background: #dbe2ea;
            border: 2px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 1px 2px rgba(15, 23, 42, 0.12);
            margin-top: 0.2rem;
        }

        .message-avatar-placeholder {
            width: 34px;
            height: 34px;
            min-width: 34px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            font-size: 0.8rem;
            font-weight: 700;
            color: #334155;
            background: #dbe2ea;
            border: 2px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 1px 2px rgba(15, 23, 42, 0.12);
            margin-top: 0.2rem;
        }

        .message-avatar-spacer {
            width: 34px;
            min-width: 34px;
            flex: 0 0 34px;
            height: 34px;
        }

        .message-bubble {
            max-width: 70%;
            padding: 8px 14px;
            border-radius: 18px;
            margin-bottom: 0;
            word-wrap: break-word;
        }

        .message-bubble.image-message {
            padding: 8px;
            background: transparent;
        }

        .message-image {
            display: block;
            max-width: 320px;
            max-height: 320px;
            width: 100%;
            height: auto;
            border-radius: 14px;
            object-fit: cover;
            background: #dbe2ea;
        }

        .message-mine {
            background-color: #0d6efd;
            color: white;
            margin-left: auto;
        }

        .message-theirs {
            background-color: #e2e3e5;
            color: black;
        }

        .user-list-item {
            cursor: pointer;
        }

        .user-list-item.active {
            background-color: #0d6efd;
            color: white;
        }

        .modal-message-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }

        .modal-message-image {
            max-width: 100%;
            max-height: 70vh;
            width: auto;
            height: auto;
            border-radius: 8px;
            object-fit: contain;
        }

        .modal-message-text {
            word-wrap: break-word;
            white-space: pre-wrap;
            max-height: 60vh;
            overflow-y: auto;
            padding: 1rem;
            background: #f8f9fa;
            border-radius: 8px;
            width: 100%;
        }

        .modal-message-meta {
            font-size: 0.875rem;
            color: #6c757d;
            text-align: center;
        }

        .chat-state-panel {
            border: 1px solid #dee2e6;
            border-radius: 12px;
            background: #fff;
            padding: 1rem;
        }

        .chat-state-panel .text-muted {
            margin-bottom: 0;
        }

        .friend-request-item {
            background: #fff3cd;
            border: 1px solid #ffc107;
            border-radius: 6px;
            padding: 0.75rem;
            font-size: 0.85rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .friend-request-item-name {
            font-weight: 600;
            color: #333;
        }

        .friend-request-item-actions {
            display: flex;
            gap: 0.5rem;
        }

        .friend-request-item-actions button {
            flex: 1;
            padding: 0.35rem 0.6rem;
            font-size: 0.75rem;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
        }

        .friend-request-item-actions .btn-accept {
            background: #198754;
            color: white;
        }

        .friend-request-item-actions .btn-accept:hover {
            background: #157347;
        }

        .friend-request-item-actions .btn-reject {
            background: #dc3545;
            color: white;
        }

        .friend-request-item-actions .btn-reject:hover {
            background: #bb2d3b;
        }
    </style>
</head>

<body>

    <div class="container-fluid h-100">
        <div class="row h-100">

            <!-- Sidebar: user list -->
            <div class="col-3 border-end p-0 d-flex flex-column">
                <div class="p-3 border-bottom d-flex justify-content-between align-items-center gap-2">
                    <div class="d-flex flex-column">
                        <strong th:text="${currentUser.username}">Username</strong>
                        <a th:href="@{/profile}" class="small text-decoration-none">Edit profile</a>
                    </div>
                    <form th:action="@{/logout}" method="post" class="d-inline">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <button type="submit" class="btn btn-sm btn-outline-danger">Logout</button>
                    </form>
                </div>
                
                <!-- Pending friend requests section -->
                <div id="pendingRequestsSection" class="border-bottom p-3 d-none">
                    <div class="small fw-bold mb-2 text-success">Friend Requests</div>
                    <div id="pendingRequestsList" class="d-flex flex-column gap-2"></div>
                </div>
                
                <div class="overflow-auto flex-grow-1">
                    <div th:each="user : ${users}" class="user-list-item list-group-item list-group-item-action p-3"
                        th:data-userid="${user.userId}" th:data-username="${user.username}"
                        th:data-profilepictureurl="${user.profilePictureUrl}" th:text="${user.username}">
                    </div>
                    <div th:if="${#lists.isEmpty(users)}" class="p-3 text-muted small">
                        No other users yet. Ask your colleagues to register!
                    </div>
                </div>
            </div>

            <!-- Chat area -->
            <div class="col-9 d-flex flex-column p-3">
                <div id="chat-header" class="mb-2 text-muted">
                    Select a user to start chatting
                </div>

                <div id="messages"></div>

                <div id="chatControls" class="mt-2 d-none">
                    <div class="input-group">
                        <input type="text" id="messageInput" class="form-control" placeholder="Type a message...">
                        <button class="btn btn-primary" id="sendBtn">Send</button>
                    </div>
                    <div class="input-group mt-2">
                        <input type="file" id="imageInput" class="form-control" accept="image/*">
                        <button class="btn btn-outline-primary" id="uploadImageBtn">Send image</button>
                    </div>
                </div>

                <div id="friendRequestControls" class="mt-2 d-none">
                    <div class="chat-state-panel d-flex flex-column flex-md-row gap-3 align-items-md-center justify-content-between">
                        <div>
                            <strong>Not friends yet</strong>
                            <div class="text-muted small">Send a friend request to unlock chat and image sharing.</div>
                        </div>
                        <div class="d-flex align-items-center gap-2">
                            <span id="friendRequestStatus" class="small text-muted"></span>
                            <button id="addFriendBtn" class="btn btn-success" disabled>Add friend</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Message Detail Modal -->
    <div class="modal fade" id="messageModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Message Details</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="modalMessageContent" class="modal-message-content"></div>
                    <div id="modalMessageMeta" class="modal-message-meta mt-3"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- SockJS + STOMP -->
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

    <script th:inline="javascript">
        const currentUserId = /*[[${currentUser.userId}]]*/ '';
        const currentUsername = /*[[${currentUser.username}]]*/ '';
        const currentUserProfilePictureUrl = /*[[${currentUser.profilePictureUrl}]]*/ '';

        let stompClient = null;
        let selectedUserId = null;
        let selectedUsername = null;
        let currentSubscription = null;
        let usersTopicSubscription = null;
        let friendRequestsSubscription = null;
        let lastRenderedSenderId = null;
        let friendIds = new Set();
        let pendingFriendRequestRecipientIds = new Set();
        let pendingIncomingFriendRequests = new Map(); // requestId -> notification
        let currentFriendRequestStatus = null;
        const userProfilePictureById = {
            [currentUserId]: currentUserProfilePictureUrl || ''
        };
        const imageInput = document.getElementById('imageInput');
        const uploadImageBtn = document.getElementById('uploadImageBtn');
        const chatControls = document.getElementById('chatControls');
        const friendRequestControls = document.getElementById('friendRequestControls');
        const addFriendBtn = document.getElementById('addFriendBtn');
        const friendRequestStatus = document.getElementById('friendRequestStatus');

        imageInput.disabled = false;
        uploadImageBtn.disabled = false;

        function renderSelectionState() {
            const messageInput = document.getElementById('messageInput');
            const sendBtn = document.getElementById('sendBtn');

            if (!selectedUserId) {
                chatControls.classList.add('d-none');
                friendRequestControls.classList.add('d-none');
                document.getElementById('chat-header').textContent = 'Select a user to start chatting';
                document.getElementById('messages').innerHTML = '';
                return;
            }

            const isFriend = friendIds.has(selectedUserId);
            document.getElementById('chat-header').textContent =
                isFriend ? 'Chatting with ' + selectedUsername : 'Send a friend request to ' + selectedUsername;

            if (isFriend) {
                friendRequestControls.classList.add('d-none');
                chatControls.classList.remove('d-none');
                messageInput.disabled = false;
                sendBtn.disabled = false;
                imageInput.disabled = false;
                uploadImageBtn.disabled = false;
                imageInput.value = '';
                friendRequestStatus.textContent = '';
                addFriendBtn.disabled = false;
                addFriendBtn.textContent = 'Add friend';
                currentFriendRequestStatus = null;
            } else {
                chatControls.classList.add('d-none');
                friendRequestControls.classList.remove('d-none');
                messageInput.disabled = true;
                sendBtn.disabled = true;
                imageInput.disabled = true;
                uploadImageBtn.disabled = true;
                imageInput.value = '';
                friendRequestStatus.textContent = currentFriendRequestStatus || '';
                addFriendBtn.disabled = currentFriendRequestStatus === 'pending';
                addFriendBtn.textContent = currentFriendRequestStatus === 'pending' ? 'Request sent' : 'Add friend';
            }
        }

        function loadFriends() {
            return fetch('/api/friends')
                .then(response => response.json())
                .then(users => {
                    friendIds = new Set((users || []).map(user => user.userId));
                })
                .catch(() => {
                    friendIds = new Set();
                })
                .finally(() => {
                    renderSelectionState();
                    if (selectedUserId && friendIds.has(selectedUserId)) {
                        loadConversationForSelectedUser();
                    }
                });
        }

        function loadOutgoingPendingFriendRequests() {
            return fetch('/api/friend-requests/sent-pending')
                .then(response => response.json())
                .then(requests => {
                    pendingFriendRequestRecipientIds = new Set((requests || []).map(request => request.recipientId));
                })
                .catch(() => {
                    pendingFriendRequestRecipientIds = new Set();
                });
        }

        function loadIncomingPendingFriendRequests() {
            return fetch('/api/friend-requests/pending')
                .then(response => response.json())
                .then(requests => {
                    pendingIncomingFriendRequests.clear();
                    (requests || []).forEach(request => {
                        const notification = {
                            requestId: request.requestId,
                            senderId: request.senderId,
                            senderUsername: request.senderUsername,
                            recipientId: request.recipientId,
                            timestamp: request.timestamp,
                            status: request.status
                        };
                        pendingIncomingFriendRequests.set(request.requestId, notification);
                    });
                    renderPendingIncomingRequests();
                })
                .catch(() => {
                    pendingIncomingFriendRequests.clear();
                    renderPendingIncomingRequests();
                });
        }

        function resetConversationSubscription() {
            if (currentSubscription) {
                currentSubscription.unsubscribe();
                currentSubscription = null;
            }
        }

        function loadConversationForSelectedUser() {
            if (!selectedUserId || !friendIds.has(selectedUserId)) {
                document.getElementById('messages').innerHTML = '';
                lastRenderedSenderId = null;
                return;
            }

            resetConversationSubscription();

            const conversationId = buildConversationId(currentUserId, selectedUserId);

            currentSubscription = stompClient.subscribe(
                '/topic/conversation.' + conversationId,
                (msg) => {
                    const message = JSON.parse(msg.body);
                    displayMessage(message);
                }
            );

            loadHistory(selectedUserId);
        }

        function selectUser(item) {
            document.querySelectorAll('.user-list-item')
                .forEach(i => i.classList.remove('active'));
            item.classList.add('active');

            selectedUserId = item.dataset.userid;
            selectedUsername = item.dataset.username;
            currentFriendRequestStatus = pendingFriendRequestRecipientIds.has(selectedUserId) ? 'pending' : null;
            renderSelectionState();

            if (friendIds.has(selectedUserId)) {
                loadConversationForSelectedUser();
            } else {
                resetConversationSubscription();
                document.getElementById('messages').innerHTML = '';
                lastRenderedSenderId = null;
            }
        }

        document.querySelectorAll('.user-list-item').forEach(item => {
            userProfilePictureById[item.dataset.userid] = item.dataset.profilepictureurl || '';
            registerUserListItem(item);
        });

        function registerUserListItem(item) {
            item.addEventListener('click', () => {
                selectUser(item);
            });
        }

        function addUserToSidebar(user) {
            if (!user || !user.userId || user.userId === currentUserId) {
                return;
            }

            if (document.querySelector('.user-list-item[data-userid="' + user.userId + '"]')) {
                return;
            }

            const list = document.querySelector('.overflow-auto.flex-grow-1');
            const emptyState = list.querySelector('.text-muted.small');
            if (emptyState) {
                emptyState.remove();
            }

            const item = document.createElement('div');
            item.className = 'user-list-item list-group-item list-group-item-action p-3';
            item.dataset.userid = user.userId;
            item.dataset.username = user.username || '';
            item.dataset.profilepictureurl = user.profilePictureUrl || '';
            item.textContent = user.username || 'Unknown user';

            userProfilePictureById[user.userId] = user.profilePictureUrl || '';
            registerUserListItem(item);
            list.appendChild(item);
        }

        function handleIncomingFriendRequest(notification) {
            if (!notification || !notification.requestId) {
                return;
            }

            if (notification.status === 'ACCEPTED') {
                handleAcceptedFriendRequest(notification);
                return;
            }

            // Store the incoming friend request
            pendingIncomingFriendRequests.set(notification.requestId, notification);
            // Render all pending incoming requests
            renderPendingIncomingRequests();
        }

        function handleAcceptedFriendRequest(notification) {
            const friendUserId = notification.senderId === currentUserId
                ? notification.recipientId
                : notification.senderId;

            if (!friendUserId) {
                return;
            }

            friendIds.add(friendUserId);
            pendingFriendRequestRecipientIds.delete(friendUserId);
            pendingIncomingFriendRequests.delete(notification.requestId);

            if (selectedUserId === friendUserId) {
                currentFriendRequestStatus = null;
                renderSelectionState();
                loadConversationForSelectedUser();
                return;
            }

            renderPendingIncomingRequests();
        }

        function renderPendingIncomingRequests() {
            const section = document.getElementById('pendingRequestsSection');
            const list = document.getElementById('pendingRequestsList');
            
            if (pendingIncomingFriendRequests.size === 0) {
                section.classList.add('d-none');
                list.innerHTML = '';
                return;
            }

            section.classList.remove('d-none');
            list.innerHTML = '';

            for (const [requestId, notification] of pendingIncomingFriendRequests) {
                const item = document.createElement('div');
                item.className = 'friend-request-item';
                item.dataset.requestid = requestId;

                const nameDiv = document.createElement('div');
                nameDiv.className = 'friend-request-item-name';
                nameDiv.textContent = notification.senderUsername;

                const actionsDiv = document.createElement('div');
                actionsDiv.className = 'friend-request-item-actions';

                const acceptBtn = document.createElement('button');
                acceptBtn.className = 'btn-accept';
                acceptBtn.textContent = 'Accept';
                acceptBtn.addEventListener('click', () => acceptFriendRequestIncoming(requestId, notification.senderId));

                const rejectBtn = document.createElement('button');
                rejectBtn.className = 'btn-reject';
                rejectBtn.textContent = 'Reject';
                rejectBtn.addEventListener('click', () => rejectFriendRequestIncoming(requestId));

                actionsDiv.appendChild(acceptBtn);
                actionsDiv.appendChild(rejectBtn);

                item.appendChild(nameDiv);
                item.appendChild(actionsDiv);
                list.appendChild(item);
            }
        }

        function acceptFriendRequestIncoming(requestId, senderId) {
            fetch('/api/friend-requests/' + encodeURIComponent(requestId) + '/accept', {
                method: 'POST'
            })
                .then(async response => {
                    const payload = await response.json().catch(() => ({}));
                    if (!response.ok) {
                        throw new Error(payload.error || 'Could not accept friend request');
                    }

                    // Remove from pending and add to friends
                    pendingIncomingFriendRequests.delete(requestId);
                    friendIds.add(senderId);
                    renderPendingIncomingRequests();

                    // If this user is selected, update the chat interface
                    if (selectedUserId === senderId) {
                        renderSelectionState();
                        loadConversationForSelectedUser();
                    }
                })
                .catch(error => {
                    alert(error.message || 'Could not accept friend request.');
                });
        }

        function rejectFriendRequestIncoming(requestId) {
            if (!requestId) return;

            fetch('/api/friend-requests/' + encodeURIComponent(requestId) + '/reject', {
                method: 'POST'
            })
                .then(async response => {
                    const payload = await response.json().catch(() => ({}));
                    if (!response.ok) {
                        throw new Error(payload.error || 'Could not reject friend request');
                    }

                    // Remove from pending list in the UI
                    pendingIncomingFriendRequests.delete(requestId);
                    renderPendingIncomingRequests();
                })
                .catch(error => {
                    alert(error.message || 'Could not reject friend request.');
                });
        }

        function connect() {
            const socket = new SockJS('/ws');
            stompClient = Stomp.over(socket);
            stompClient.debug = null; // suppress console spam
            stompClient.connect({}, () => {
                console.log('WebSocket connected');

                usersTopicSubscription = stompClient.subscribe('/topic/users.created', (msg) => {
                    addUserToSidebar(JSON.parse(msg.body));
                });

                // Subscribe to incoming friend requests for this userId.
                friendRequestsSubscription = stompClient.subscribe('/topic/friend-requests.' + currentUserId, (msg) => {
                    handleIncomingFriendRequest(JSON.parse(msg.body));
                });

                Promise.all([loadFriends(), loadOutgoingPendingFriendRequests(), loadIncomingPendingFriendRequests()])
                    .then(() => renderSelectionState());
            });
        }

        // Build the same conversationId as the backend
        function buildConversationId(id1, id2) {
            return id1 < id2 ? id1 + '#' + id2 : id2 + '#' + id1;
        }

        function loadHistory(recipientId) {
            document.getElementById('messages').innerHTML = '';
            lastRenderedSenderId = null;
            fetch('/api/messages/' + recipientId)
                .then(res => res.json())
                .then(messages => messages.forEach(displayMessage));
        }

        function getInitials(name) {
            const trimmed = (name || '').trim();
            if (!trimmed) return '?';
            const parts = trimmed.split(/\s+/).filter(Boolean);
            if (parts.length === 1) {
                return parts[0].slice(0, 2).toUpperCase();
            }
            return (parts[0][0] + parts[1][0]).toUpperCase();
        }

        function createAvatar(userId, fallbackName) {
            const imageUrl = userProfilePictureById[userId];
            if (imageUrl) {
                const image = document.createElement('img');
                image.className = 'message-avatar';
                image.src = imageUrl;
                image.alt = fallbackName + ' avatar';
                return image;
            }

            const placeholder = document.createElement('div');
            placeholder.className = 'message-avatar-placeholder';
            placeholder.textContent = getInitials(fallbackName);
            return placeholder;
        }

        function createMediaUrl(mediaKey) {
            return '/api/messages/media?key=' + encodeURIComponent(mediaKey);
        }

        function renderMessageBody(message, bubble, isClickable = true) {
            const isImageMessage = message.messageType === 'IMAGE' || !!message.mediaUrl;

            if (isImageMessage) {
                bubble.classList.add('image-message');

                const image = document.createElement('img');
                image.className = 'message-image';
                image.src = message.mediaUrl || createMediaUrl(message.mediaKey);
                image.alt = 'Chat image';
                image.style.cursor = 'pointer';
                image.addEventListener('click', (e) => {
                    e.stopPropagation();
                    openMessageModal(message);
                });
                bubble.appendChild(image);
                return;
            }

            const text = document.createElement('div');
            text.textContent = message.content || '';
            bubble.appendChild(text);
        }

        function displayMessage(message) {
            const container = document.getElementById('messages');
            const isMine = message.senderId === currentUserId;
            const isThreadStart = lastRenderedSenderId !== message.senderId;
            const senderName = isMine ? currentUsername : message.senderUsername;

            const wrapper = document.createElement('div');
            wrapper.className = 'message-row ' + (isMine ? 'mine' : 'theirs') + (isThreadStart ? '' : ' continued');

            const avatar = isThreadStart ? createAvatar(message.senderId, senderName) : document.createElement('div');
            if (!isThreadStart) {
                // avatar.className = 'message-avatar-spacer';
            }

            const bubble = document.createElement('div');
            bubble.className = 'message-bubble ' + (isMine ? 'message-mine' : 'message-theirs');

            if (!isMine && isThreadStart) {
                const name = document.createElement('div');
                name.className = 'message-meta fw-bold';
                name.textContent = message.senderUsername;
                bubble.appendChild(name);
            }

            renderMessageBody(message, bubble);

            if (isMine) {
                wrapper.appendChild(bubble);
                wrapper.appendChild(avatar);
            } else {
                wrapper.appendChild(avatar);
                wrapper.appendChild(bubble);
            }

            container.appendChild(wrapper);
            container.scrollTop = container.scrollHeight;
            lastRenderedSenderId = message.senderId;
        }

        // Send message
        document.getElementById('sendBtn').addEventListener('click', sendMessage);
        document.getElementById('messageInput').addEventListener('keydown', e => {
            if (e.key === 'Enter') sendMessage();
        });

        uploadImageBtn.addEventListener('click', uploadImageMessage);
        addFriendBtn.addEventListener('click', sendFriendRequest);

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const content = input.value.trim();
            if (!content || !selectedUserId || !friendIds.has(selectedUserId)) return;

            stompClient.send('/app/chat.send', {}, JSON.stringify({
                recipientId: selectedUserId,
                content: content
            }));

            input.value = '';
        }

        function uploadImageMessage() {
            const file = imageInput.files[0];
            if (!file || !selectedUserId || !friendIds.has(selectedUserId)) {
                return;
            }

            const formData = new FormData();
            formData.append('recipientId', selectedUserId);
            formData.append('file', file);

            uploadImageBtn.disabled = true;

            fetch('/api/messages/image', {
                method: 'POST',
                body: formData
            })
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Image upload failed');
                    }
                    return response.json();
                })
                .then(() => {
                    imageInput.value = '';
                })
                .catch(() => {
                    alert('Could not send the image. Please try again.');
                })
                .finally(() => {
                    uploadImageBtn.disabled = !selectedUserId || !friendIds.has(selectedUserId);
                });
        }

        function sendFriendRequest() {
            if (!selectedUserId || friendIds.has(selectedUserId) || currentFriendRequestStatus === 'pending') {
                return;
            }

            addFriendBtn.disabled = true;
            addFriendBtn.textContent = 'Sending...';

            fetch('/api/friend-requests/send/' + encodeURIComponent(selectedUserId), {
                method: 'POST'
            })
                .then(async response => {
                    const payload = await response.json().catch(() => ({}));
                    if (!response.ok) {
                        throw new Error(payload.error || 'Could not send friend request');
                    }

                    if (payload.status === 'ACCEPTED') {
                        friendIds.add(selectedUserId);
                        pendingFriendRequestRecipientIds.delete(selectedUserId);
                        currentFriendRequestStatus = null;
                        renderSelectionState();
                        loadConversationForSelectedUser();
                        return;
                    }

                    pendingFriendRequestRecipientIds.add(selectedUserId);
                    currentFriendRequestStatus = 'pending';
                    friendRequestStatus.textContent = 'Friend request sent';
                    renderSelectionState();
                })
                .catch(error => {
                    currentFriendRequestStatus = null;
                    friendRequestStatus.textContent = '';
                    addFriendBtn.disabled = false;
                    addFriendBtn.textContent = 'Add friend';
                    alert(error.message || 'Could not send friend request.');
                });
        }

        function formatMessageTime(timestamp) {
            if (!timestamp) return '';
            try {
                const date = new Date(timestamp);
                return date.toLocaleString();
            } catch (e) {
                return timestamp;
            }
        }

        function openMessageModal(message) {
            const modalContent = document.getElementById('modalMessageContent');
            const modalMeta = document.getElementById('modalMessageMeta');
            const isImageMessage = message.messageType === 'IMAGE' || !!message.mediaUrl;
            const isMine = message.senderId === currentUserId;

            // Clear previous content
            modalContent.innerHTML = '';
            modalMeta.innerHTML = '';

            // Display message content
            if (isImageMessage) {
                const image = document.createElement('img');
                image.className = 'modal-message-image';
                image.src = message.mediaUrl || createMediaUrl(message.mediaKey);
                image.alt = 'Chat image';
                modalContent.appendChild(image);
            } else {
                const text = document.createElement('div');
                text.className = 'modal-message-text';
                text.textContent = message.content || '';
                modalContent.appendChild(text);
            }

            // Display metadata
            const senderName = isMine ? 'You' : message.senderUsername;
            const timeStr = formatMessageTime(message.timestamp);
            modalMeta.innerHTML = `<strong>${senderName}</strong> • ${timeStr}`;

            // Show modal
            const modal = new bootstrap.Modal(document.getElementById('messageModal'));
            modal.show();
        }

        connect();
    </script>
