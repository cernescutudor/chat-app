<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />
    <title>Chat - ChatApp</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/chat.css}">
</head>

<body class="bg-shapes" style="background: var(--navy); color: var(--text);">

    <div class="container-fluid h-100">
        <div class="row h-100">

            <!-- Sidebar: user list -->
            <div class="col-3 border-end p-0 d-flex flex-column h-100 position-relative overflow-hidden">
                <div class="p-3 border-bottom d-flex justify-content-between align-items-center gap-2">
                    <div class="d-flex flex-column">
                        <strong th:text="${currentUser.username}">Username</strong>
                        <a th:href="@{/profile}" class="small text-decoration-none">Edit profile</a>
                    </div>
                    <form th:action="@{/logout}" method="post" class="d-inline">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <button type="submit" class="btn btn-sm btn-outline-danger">Logout</button>
                    </form>
                </div>

                <div class="p-2 border-bottom">
                    <button class="btn btn-sm btn-outline-primary w-100" data-bs-toggle="modal"
                        data-bs-target="#searchUserModal">Find Users</button>
                </div>

                <div id="chatOptionsWrapper" class="overflow-auto flex-grow-1">
                    <div id="userListContainer">
                        <div th:each="user : ${users}"
                            class="user-list-item list-group-item list-group-item-action p-3 friend-item"
                            th:data-userid="${user.userId}" th:data-username="${user.username}"
                            th:data-profilepictureurl="${user.profilePictureUrl}">
                            <span th:text="${user.username}"></span>
                        </div>
                        <div id="noFriendsMsg" th:if="${#lists.isEmpty(users)}" class="p-3 text-muted small">
                            No friends yet. Click "Find Users" to start!
                        </div>
                    </div>
                </div>

                <!-- Friend requests row at the bottom -->
                <div id="friendRequestsToggle" class="p-3 border-top" style="cursor: pointer; z-index: 10; background: var(--card-bg); border-color: var(--border) !important;">
                    <div class="d-flex justify-content-between align-items-center">
                        <span class="fw-bold" style="color: var(--text);">Friend requests <span id="friendRequestsCount"
                                class="badge bg-danger rounded-pill">0</span></span>
                        <span id="friendRequestsToggleIcon" style="color: var(--text);">▼</span>
                    </div>
                </div>

                <!-- Pending friend requests expansive section -->
                <div id="pendingRequestsSection" class="position-absolute w-100 flex-column pending-requests-panel"
                    style="bottom: 56px; top: 120px; z-index: 5; border-top: 1px solid var(--border); overflow-y: auto; background: var(--navy-mid);">
                    <div class="p-2 border-bottom fw-bold small" style="color: var(--text-muted); border-color: var(--border) !important;">Incoming Requests</div>
                    <div id="pendingRequestsListContainer" class="p-2 d-flex flex-column gap-2"></div>
                    <div class="p-2 border-bottom border-top fw-bold small mt-1" style="color: var(--text-muted); border-color: var(--border) !important;">Outgoing Requests</div>
                    <div id="outgoingRequestsListContainer" class="p-2 d-flex flex-column gap-2"></div>
                </div>
            </div>

            <!-- Chat area -->
            <div class="col-9 d-flex flex-column p-3">
                <div id="chat-header" class="mb-2 text-muted">
                    Select a user to start chatting
                </div>

                <div id="messages"></div>

                <div id="chatControls" class="mt-2 d-none">
                    <div class="input-group">
                        <input type="text" id="messageInput" class="form-control" placeholder="Type a message...">
                        <button class="btn btn-primary" id="sendBtn">Send</button>
                    </div>
                    <div class="input-group mt-2">
                        <input type="file" id="imageInput" class="form-control" accept="image/*">
                        <button class="btn btn-outline-primary" id="uploadImageBtn">Send image</button>
                    </div>
                </div>

                <div id="friendRequestControls" class="mt-2 d-none">
                    <div
                        class="chat-state-panel d-flex flex-column flex-md-row gap-3 align-items-md-center justify-content-between">
                        <div>
                            <strong id="friendRequestHeading">Not friends yet</strong>
                            <div id="friendRequestText" class="text-muted small">Send a friend request to unlock chat
                                and image sharing.</div>
                        </div>
                        <div class="d-flex align-items-center gap-2">
                            <span id="friendRequestStatus" class="small text-muted"></span>
                            <!-- For sending request -->
                            <div class="input-group" id="sendRequestGroup">
                                <input type="text" id="friendRequestMessage" class="form-control form-control-sm"
                                    placeholder="Message (optional)">
                                <button id="addFriendBtn" class="btn btn-success btn-sm" disabled>Add friend</button>
                            </div>
                            <!-- For receiving request -->
                            <div id="receiveRequestGroup" class="d-none gap-2">
                                <button id="acceptFriendBtn" class="btn btn-success btn-sm">Yes (Accept)</button>
                                <button id="rejectFriendBtn" class="btn btn-danger btn-sm">Reject</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Message Detail Modal -->
    <div class="modal fade" id="messageModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Message Details</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="modalMessageContent" class="modal-message-content"></div>
                    <div id="modalMessageMeta" class="modal-message-meta mt-3"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Search User Modal -->
    <div class="modal fade" id="searchUserModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Find Users</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="input-group mb-3">
                        <input type="text" id="userSearchInput" class="form-control"
                            placeholder="Search by username...">
                        <button class="btn btn-primary" id="userSearchBtn">Search</button>
                    </div>
                    <div id="searchResults" class="list-group">
                        <!-- Results go here -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- SockJS + STOMP -->
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

    <script th:inline="javascript">
        const currentUserId = /*[[${currentUser.userId}]]*/ '';
        const currentUsername = /*[[${currentUser.username}]]*/ '';
        const currentUserProfilePictureUrl = /*[[${currentUser.profilePictureUrl}]]*/ '';

        let stompClient = null;
        let selectedUserId = null;
        let selectedUsername = null;
        let currentSubscription = null;
        let usersTopicSubscription = null;
        let friendRequestsSubscription = null;
        let lastRenderedSenderId = null;
        let friendIds = new Set();
        let outgoingPendingRequests = new Map(); // recipientId -> request object
        let pendingIncomingFriendRequests = new Map(); // requestId -> notification
        let currentFriendRequestStatus = null;
        let unreadCounts = new Map();
        const userProfilePictureById = {
            [currentUserId]: currentUserProfilePictureUrl || ''
        };
        const imageInput = document.getElementById('imageInput');
        const uploadImageBtn = document.getElementById('uploadImageBtn');
        const chatControls = document.getElementById('chatControls');
        const friendRequestControls = document.getElementById('friendRequestControls');
        const addFriendBtn = document.getElementById('addFriendBtn');
        const friendRequestStatus = document.getElementById('friendRequestStatus');

        imageInput.disabled = false;
        uploadImageBtn.disabled = false;

        function renderSelectionState() {
            const messageInput = document.getElementById('messageInput');
            const sendBtn = document.getElementById('sendBtn');
            const addFriendBtn = document.getElementById('addFriendBtn');
            const sendRequestGroup = document.getElementById('sendRequestGroup');
            const receiveRequestGroup = document.getElementById('receiveRequestGroup');
            const friendRequestText = document.getElementById('friendRequestText');
            const friendRequestStatus = document.getElementById('friendRequestStatus');

            if (!selectedUserId) {
                chatControls.classList.add('d-none');
                friendRequestControls.classList.add('d-none');
                document.getElementById('chat-header').textContent = 'Select a user to start chatting';
                document.getElementById('messages').innerHTML = '';
                return;
            }

            const isFriend = friendIds.has(selectedUserId);
            document.getElementById('chat-header').textContent =
                isFriend ? 'Chatting with ' + selectedUsername : 'Send a friend request to ' + selectedUsername;

            if (isFriend) {
                friendRequestControls.classList.add('d-none');
                chatControls.classList.remove('d-none');
                messageInput.disabled = false;
                sendBtn.disabled = false;
                imageInput.disabled = false;
                uploadImageBtn.disabled = false;
                imageInput.value = '';
                friendRequestStatus.textContent = '';
                addFriendBtn.disabled = false;
                currentFriendRequestStatus = null;
            } else {
                chatControls.classList.add('d-none');
                friendRequestControls.classList.remove('d-none');
                messageInput.disabled = true;
                sendBtn.disabled = true;
                imageInput.disabled = true;
                uploadImageBtn.disabled = true;
                imageInput.value = '';

                let incomingRequestId = null;
                for (const [reqId, req] of pendingIncomingFriendRequests) {
                    if (req.senderId === selectedUserId) {
                        incomingRequestId = reqId;
                        break;
                    }
                }

                if (incomingRequestId) {
                    sendRequestGroup.classList.add('d-none');
                    receiveRequestGroup.classList.remove('d-none');
                    receiveRequestGroup.classList.add('d-flex');
                    document.getElementById('friendRequestHeading').textContent = 'Not friends yet';
                    friendRequestText.textContent = 'Not friends yet, accept the friend request to unlock chat and image sharing.';
                    friendRequestStatus.textContent = '';
                } else {
                    sendRequestGroup.classList.remove('d-none');
                    receiveRequestGroup.classList.add('d-none');
                    receiveRequestGroup.classList.remove('d-flex');
                    document.getElementById('friendRequestHeading').textContent = 'Not friends yet';
                    friendRequestText.textContent = 'Send a friend request to unlock chat and image sharing.';
                    friendRequestStatus.textContent = currentFriendRequestStatus === 'pending' ? 'Request sent' : '';
                    addFriendBtn.disabled = currentFriendRequestStatus === 'pending';
                    addFriendBtn.textContent = currentFriendRequestStatus === 'pending' ? 'Request sent' : 'Add friend';
                }
            }
        }

        function loadFriends() {
            return fetch('/api/friends')
                .then(response => response.json())
                .then(users => {
                    friendIds = new Set((users || []).map(user => user.userId));
                    // Load unread counts for each friend
                    return Promise.all((users || []).map(user =>
                        fetch('/api/messages/' + user.userId)
                            .then(res => res.json())
                            .then(messages => {
                                const unread = messages.filter(
                                    m => !m.seen && m.senderId !== currentUserId
                                ).length;
                                if (unread > 0) {
                                    unreadCounts.set(user.userId, unread);
                                }
                            })
                            .catch(() => { })
                    ));
                })
                .catch(() => { friendIds = new Set(); })
                .finally(() => {
                    renderSelectionState();
                    // Apply badges after friends are loaded
                    unreadCounts.forEach((count, userId) => setUnreadBadge(userId, count));
                });
        }

        function loadOutgoingPendingFriendRequests() {
            return fetch('/api/friend-requests/sent-pending')
                .then(response => response.json())
                .then(requests => {
                    outgoingPendingRequests.clear();
                    (requests || []).forEach(r => outgoingPendingRequests.set(r.recipientId, r));
                    renderOutgoingPendingRequests();
                })
                .catch(() => {
                    outgoingPendingRequests.clear();
                    renderOutgoingPendingRequests();
                });
        }

        function loadIncomingPendingFriendRequests() {
            return fetch('/api/friend-requests/pending')
                .then(response => response.json())
                .then(requests => {
                    pendingIncomingFriendRequests.clear();
                    (requests || []).forEach(request => {
                        const notification = {
                            requestId: request.requestId,
                            senderId: request.senderId,
                            senderUsername: request.senderUsername,
                            recipientId: request.recipientId,
                            timestamp: request.timestamp,
                            status: request.status,
                            message: request.message
                        };
                        pendingIncomingFriendRequests.set(request.requestId, notification);
                    });
                    renderPendingIncomingRequests();
                })
                .catch(() => {
                    pendingIncomingFriendRequests.clear();
                    renderPendingIncomingRequests();
                });
        }

        function resetConversationSubscription() {
            if (currentSubscription) {
                currentSubscription.unsubscribe();
                currentSubscription = null;
            }
        }

        function loadConversationForSelectedUser() {
            if (!selectedUserId || !friendIds.has(selectedUserId)) {
                document.getElementById('messages').innerHTML = '';
                lastRenderedSenderId = null;
                return;
            }

            resetConversationSubscription();

            const conversationId = buildConversationId(currentUserId, selectedUserId);

            currentSubscription = stompClient.subscribe(
                '/topic/conversation.' + conversationId,
                (msg) => {
                    const message = JSON.parse(msg.body);
                    displayMessage(message);

                    const senderId = message.senderId;

                    if (senderId !== currentUserId) {
                        if (selectedUserId === senderId) {
                            // Conversation is open — mark as seen immediately
                            markAsSeen(senderId);
                        } else {
                            // Conversation is not open — increment badge
                            const current = unreadCounts.get(senderId) || 0;
                            unreadCounts.set(senderId, current + 1);
                            setUnreadBadge(senderId, current + 1);
                        }
                        // Move sender to top of sidebar regardless
                        moveUserToTop(senderId);
                    }
                }
            );

            loadHistory(selectedUserId);
        }

        function selectUser(item) {
            document.querySelectorAll('.user-list-item')
                .forEach(i => i.classList.remove('active'));
            item.classList.add('active');

            selectedUserId = item.dataset.userid;
            selectedUsername = item.dataset.username;
            currentFriendRequestStatus = outgoingPendingRequests.has(selectedUserId) ? 'pending' : null;
            renderSelectionState();

            if (friendIds.has(selectedUserId)) {
                loadConversationForSelectedUser();
            } else {
                resetConversationSubscription();
                document.getElementById('messages').innerHTML = '';
                lastRenderedSenderId = null;

                // Show the request message if there is an incoming request
                for (const [reqId, req] of pendingIncomingFriendRequests) {
                    if (req.senderId === selectedUserId && req.message) {
                        displayMessage({
                            senderId: req.senderId,
                            senderUsername: req.senderUsername,
                            content: req.message,
                            timestamp: req.timestamp || new Date().getTime(),
                            messageType: 'TEXT'
                        });
                        break;
                    }
                }
            }
        }

        document.querySelectorAll('.user-list-item').forEach(item => {
            userProfilePictureById[item.dataset.userid] = item.dataset.profilepictureurl || '';
            registerUserListItem(item);
        });

        const friendRequestsToggle = document.getElementById('friendRequestsToggle');
        const pendingRequestsSection = document.getElementById('pendingRequestsSection');
        const friendRequestsToggleIcon = document.getElementById('friendRequestsToggleIcon');

        if (friendRequestsToggle) {
            friendRequestsToggle.addEventListener('click', () => {
                if (pendingRequestsSection.classList.contains('show-panel')) {
                    pendingRequestsSection.classList.remove('show-panel');
                    friendRequestsToggleIcon.textContent = '▼';
                } else {
                    pendingRequestsSection.classList.add('show-panel');
                    friendRequestsToggleIcon.textContent = '▲';
                }
            });
        }

        const acceptFriendBtn = document.getElementById('acceptFriendBtn');
        const rejectFriendBtn = document.getElementById('rejectFriendBtn');

        if (acceptFriendBtn) {
            acceptFriendBtn.addEventListener('click', () => {
                let incomingRequestId = null;
                for (const [reqId, req] of pendingIncomingFriendRequests) {
                    if (req.senderId === selectedUserId) {
                        incomingRequestId = reqId;
                        break;
                    }
                }
                if (incomingRequestId) {
                    acceptFriendRequestIncoming(incomingRequestId, selectedUserId);
                }
            });
        }

        if (rejectFriendBtn) {
            rejectFriendBtn.addEventListener('click', () => {
                let incomingRequestId = null;
                for (const [reqId, req] of pendingIncomingFriendRequests) {
                    if (req.senderId === selectedUserId) {
                        incomingRequestId = reqId;
                        break;
                    }
                }
                if (incomingRequestId) {
                    rejectFriendRequestIncoming(incomingRequestId);
                }
            });
        }

        function registerUserListItem(item) {
            item.addEventListener('click', () => {
                selectUser(item);
            });
        }

        function addUserToSidebar(user) {
            if (!user || !user.userId || user.userId === currentUserId) {
                return;
            }

            if (document.querySelector('.user-list-item[data-userid="' + user.userId + '"]')) {
                return;
            }

            const list = document.getElementById('userListContainer');
            const emptyState = document.getElementById('noFriendsMsg');
            if (emptyState) {
                emptyState.remove();
            }

            const item = document.createElement('div');
            item.className = 'user-list-item list-group-item list-group-item-action p-3 friend-item';
            item.dataset.userid = user.userId;
            item.dataset.username = user.username || '';
            item.dataset.profilepictureurl = user.profilePictureUrl || '';

            const nameSpan = document.createElement('span');
            nameSpan.textContent = user.username || 'Unknown user';
            item.appendChild(nameSpan);

            userProfilePictureById[user.userId] = user.profilePictureUrl || '';
            registerUserListItem(item);
            list.appendChild(item);
        }

        function handleIncomingFriendRequest(notification) {
            if (!notification || !notification.requestId) {
                return;
            }

            if (notification.status === 'ACCEPTED') {
                handleAcceptedFriendRequest(notification);
                return;
            }

            if (notification.status === 'REJECTED') {
                outgoingPendingRequests.delete(notification.recipientId);
                renderOutgoingPendingRequests();
                
                if (selectedUserId === notification.recipientId) {
                    currentFriendRequestStatus = null;
                    friendRequestStatus.textContent = '';
                    addFriendBtn.disabled = false;
                    addFriendBtn.textContent = 'Add friend';
                    renderSelectionState();
                }
                return;
            }

            // Store the incoming friend request
            pendingIncomingFriendRequests.set(notification.requestId, notification);
            // Render all pending incoming requests
            renderPendingIncomingRequests();
        }

        function handleAcceptedFriendRequest(notification) {
            const friendUserId = notification.senderId === currentUserId
                ? notification.recipientId
                : notification.senderId;
            const friendUsername = notification.senderId === currentUserId
                ? notification.recipientUsername
                : notification.senderUsername;

            if (!friendUserId) return;

            friendIds.add(friendUserId);
            outgoingPendingRequests.delete(friendUserId);
            pendingIncomingFriendRequests.delete(notification.requestId);

            // Add to the friends sidebar immediately
            addUserToSidebar({
                userId: friendUserId,
                username: friendUsername,
                profilePictureUrl: userProfilePictureById[friendUserId] || ''
            });

            renderPendingIncomingRequests();
            renderOutgoingPendingRequests();

            if (selectedUserId === friendUserId) {
                currentFriendRequestStatus = null;
                renderSelectionState();
                loadConversationForSelectedUser();
            }
        }

        function renderPendingIncomingRequests() {
            const section = document.getElementById('pendingRequestsSection');
            const list = document.getElementById('pendingRequestsListContainer');
            const badge = document.getElementById('friendRequestsCount');

            badge.textContent = pendingIncomingFriendRequests.size;

            if (pendingIncomingFriendRequests.size === 0) {
                list.innerHTML = '<div class="text-muted small text-center p-3">No pending friend requests</div>';
                return;
            }

            list.innerHTML = '';

            for (const [requestId, notification] of pendingIncomingFriendRequests) {
                const item = document.createElement('div');
                item.className = 'friend-request-item cursor-pointer';
                item.style.cursor = 'pointer';
                item.dataset.requestid = requestId;

                // Show only name in list, click to select user
                const nameDiv = document.createElement('div');
                nameDiv.className = 'friend-request-item-name';
                nameDiv.textContent = notification.senderUsername;

                const timeDiv = document.createElement('div');
                timeDiv.className = 'small text-muted';
                if (notification.message) {
                    timeDiv.textContent = notification.message.substring(0, 30) + (notification.message.length > 30 ? '...' : '');
                } else {
                    timeDiv.textContent = 'Wants to be friends';
                }

                item.appendChild(nameDiv);
                item.appendChild(timeDiv);

                item.addEventListener('click', () => {
                    // Deselect any active sidebar item visually
                    document.querySelectorAll('.user-list-item')
                        .forEach(i => i.classList.remove('active'));

                    // Set selected user directly WITHOUT adding to the friends sidebar
                    selectedUserId = notification.senderId;
                    selectedUsername = notification.senderUsername;
                    currentFriendRequestStatus = null;

                    // Cache their profile picture if not already known
                    if (!userProfilePictureById[notification.senderId]) {
                        userProfilePictureById[notification.senderId] = '';
                    }

                    // Update the chat area to show the friend request UI
                    renderSelectionState();

                    // Show their request message in the chat area if they sent one
                    document.getElementById('messages').innerHTML = '';
                    lastRenderedSenderId = null;
                    if (notification.message && notification.message.trim()) {
                        displayMessage({
                            senderId: notification.senderId,
                            senderUsername: notification.senderUsername,
                            content: notification.message,
                            timestamp: notification.timestamp || new Date().toISOString(),
                            messageType: 'TEXT'
                        });
                    }

                    // Close the requests panel
                    document.getElementById('pendingRequestsSection').classList.remove('show-panel');
                    document.getElementById('friendRequestsToggleIcon').textContent = '▼';
                });

                list.appendChild(item);
            }
        }

        function renderOutgoingPendingRequests() {
            const list = document.getElementById('outgoingRequestsListContainer');
            if (!list) return;

            if (outgoingPendingRequests.size === 0) {
                list.innerHTML = '<div class="text-muted small text-center p-2">No outgoing requests</div>';
                return;
            }

            list.innerHTML = '';

            for (const [recipientId, request] of outgoingPendingRequests) {
                const item = document.createElement('div');
                item.className = 'friend-request-item';
                item.style.background = 'rgba(99,102,241,0.15)';
                item.style.borderColor = 'rgba(99,102,241,0.3)';

                const nameDiv = document.createElement('div');
                nameDiv.className = 'friend-request-item-name';
                nameDiv.textContent = request.recipientUsername || recipientId;

                const statusDiv = document.createElement('div');
                statusDiv.className = 'small text-muted';
                statusDiv.textContent = request.message?.trim()
                    ? 'Message: ' + request.message.substring(0, 40) + (request.message.length > 40 ? '...' : '')
                    : 'Waiting for response...';

                item.appendChild(nameDiv);
                item.appendChild(statusDiv);
                list.appendChild(item);
            }
        }

        function acceptFriendRequestIncoming(requestId, senderId) {
            fetch('/api/friend-requests/' + encodeURIComponent(requestId) + '/accept', {
                method: 'POST',
                headers: {
                    [document.querySelector('meta[name="_csrf_header"]') ? document.querySelector('meta[name="_csrf_header"]').content : 'X-CSRF-TOKEN']: document.querySelector('meta[name="_csrf"]') ? document.querySelector('meta[name="_csrf"]').content : ''
                }
            })
                .then(async response => {
                    const payload = await response.json().catch(() => ({}));
                    if (!response.ok) {
                        throw new Error(payload.error || 'Could not accept friend request');
                    }


                    // Capture username before deleting from pending map
                    const accepted = pendingIncomingFriendRequests.get(requestId);
                    const acceptedUsername = accepted?.senderUsername || selectedUsername;

                    // Remove from pending and add to friends
                    pendingIncomingFriendRequests.delete(requestId);
                    friendIds.add(senderId);
                    renderPendingIncomingRequests();

                    // Add the user to the friends sidebar
                    addUserToSidebar({
                        userId: senderId,
                        username: acceptedUsername,
                        profilePictureUrl: userProfilePictureById[senderId] || ''
                    });

                    // If this user is selected, update the chat interface
                    if (selectedUserId === senderId) {
                        renderSelectionState();
                        loadConversationForSelectedUser();
                    }
                })
                .catch(error => {
                    alert(error.message || 'Could not accept friend request.');
                });
        }

        function rejectFriendRequestIncoming(requestId) {
            if (!requestId) return;

            fetch('/api/friend-requests/' + encodeURIComponent(requestId) + '/reject', {
                method: 'POST',
                headers: {
                    [document.querySelector('meta[name="_csrf_header"]') ? document.querySelector('meta[name="_csrf_header"]').content : 'X-CSRF-TOKEN']: document.querySelector('meta[name="_csrf"]') ? document.querySelector('meta[name="_csrf"]').content : ''
                }
            })
                .then(async response => {
                    const payload = await response.json().catch(() => ({}));
                    if (!response.ok) {
                        throw new Error(payload.error || 'Could not reject friend request');
                    }

                    // Remove from pending list
                    pendingIncomingFriendRequests.delete(requestId);
                    renderPendingIncomingRequests();

                    // If the rejected user is currently selected, clear the chat area
                    if (selectedUserId) {
                        const wasSelected = [...pendingIncomingFriendRequests.values()]
                            .every(r => r.requestId !== requestId);

                        selectedUserId = null;
                        selectedUsername = null;
                        currentFriendRequestStatus = null;
                        document.getElementById('messages').innerHTML = '';
                        lastRenderedSenderId = null;
                        document.querySelectorAll('.user-list-item')
                            .forEach(i => i.classList.remove('active'));
                        renderSelectionState();
                    }
                })
                .catch(error => {
                    alert(error.message || 'Could not reject friend request.');
                });
        }

        function moveUserToTop(userId) {
            const list = document.getElementById('userListContainer');
            const item = list.querySelector('.user-list-item[data-userid="' + userId + '"]');
            if (item && list.firstChild !== item) {
                list.insertBefore(item, list.firstChild);
            }
        }

        function setUnreadBadge(userId, count) {
            const item = document.querySelector('.user-list-item[data-userid="' + userId + '"]');
            if (!item) return;

            let badge = item.querySelector('.unread-badge');
            if (count > 0) {
                if (!badge) {
                    badge = document.createElement('span');
                    badge.className = 'unread-badge badge bg-danger rounded-pill float-end';
                    item.appendChild(badge);
                }
                badge.textContent = count;
            } else {
                if (badge) badge.remove();
            }
        }

        function markAsSeen(recipientId) {
            fetch('/api/messages/' + recipientId + '/seen', {
                method: 'POST',
                headers: {
                    [document.querySelector('meta[name="_csrf_header"]').content]:
                        document.querySelector('meta[name="_csrf"]').content
                }
            }).catch(() => { });
            unreadCounts.set(recipientId, 0);
            setUnreadBadge(recipientId, 0);
        }


        function connect() {
            const socket = new SockJS('/ws');
            stompClient = Stomp.over(socket);
            stompClient.debug = null; // suppress console spam
            stompClient.connect({}, () => {
                console.log('WebSocket connected');

                usersTopicSubscription = stompClient.subscribe('/topic/users.created', (msg) => {
                    addUserToSidebar(JSON.parse(msg.body));
                });

                friendRequestsSubscription = stompClient.subscribe('/topic/friend-requests.' + currentUserId, (msg) => {
                    handleIncomingFriendRequest(JSON.parse(msg.body));
                });

                // Personal topic — receives all messages sent TO this user
                // regardless of which conversation is currently open
                stompClient.subscribe('/topic/user.' + currentUserId, (msg) => {
                    const message = JSON.parse(msg.body);
                    const senderId = message.senderId;

                    // If this conversation is already open, the conversation subscription
                    // already handled displaying it — just mark as seen
                    if (selectedUserId === senderId) {
                        markAsSeen(senderId);
                        return;
                    }

                    // Otherwise increment the badge and move sender to top
                    const current = unreadCounts.get(senderId) || 0;
                    unreadCounts.set(senderId, current + 1);
                    setUnreadBadge(senderId, current + 1);
                    moveUserToTop(senderId);
                });

                Promise.all([loadFriends(), loadOutgoingPendingFriendRequests(), loadIncomingPendingFriendRequests()])
                    .then(() => renderSelectionState());
            });
        }

        // Build the same conversationId as the backend
        function buildConversationId(id1, id2) {
            return id1 < id2 ? id1 + '#' + id2 : id2 + '#' + id1;
        }

        function loadHistory(recipientId) {
            document.getElementById('messages').innerHTML = '';
            lastRenderedSenderId = null;
            fetch('/api/messages/' + recipientId)
                .then(res => res.json())
                .then(messages => {
                    messages.forEach(displayMessage);
                    // Mark as seen when opening the conversation
                    markAsSeen(recipientId);
                });
        }

        function getInitials(name) {
            const trimmed = (name || '').trim();
            if (!trimmed) return '?';
            const parts = trimmed.split(/\s+/).filter(Boolean);
            if (parts.length === 1) {
                return parts[0].slice(0, 2).toUpperCase();
            }
            return (parts[0][0] + parts[1][0]).toUpperCase();
        }

        function createAvatar(userId, fallbackName) {
            const imageUrl = userProfilePictureById[userId];
            if (imageUrl) {
                const image = document.createElement('img');
                image.className = 'message-avatar';
                image.src = imageUrl;
                image.alt = fallbackName + ' avatar';
                return image;
            }

            const placeholder = document.createElement('div');
            placeholder.className = 'message-avatar-placeholder';
            placeholder.textContent = getInitials(fallbackName);
            return placeholder;
        }

        function createMediaUrl(mediaKey) {
            return '/api/messages/media?key=' + encodeURIComponent(mediaKey);
        }

        function renderMessageBody(message, bubble, isClickable = true) {
            const isImageMessage = message.messageType === 'IMAGE' || !!message.mediaUrl;

            if (isImageMessage) {
                bubble.classList.add('image-message');

                const image = document.createElement('img');
                image.className = 'message-image';
                image.src = message.mediaUrl || createMediaUrl(message.mediaKey);
                image.alt = 'Chat image';
                image.style.cursor = 'pointer';
                image.addEventListener('click', (e) => {
                    e.stopPropagation();
                    openMessageModal(message);
                });
                bubble.appendChild(image);
                return;
            }

            const text = document.createElement('div');
            text.textContent = message.content || '';
            bubble.appendChild(text);
        }

        function displayMessage(message) {
            const container = document.getElementById('messages');
            const isMine = message.senderId === currentUserId;
            const isThreadStart = lastRenderedSenderId !== message.senderId;
            const senderName = isMine ? currentUsername : message.senderUsername;

            const wrapper = document.createElement('div');
            wrapper.className = 'message-row ' + (isMine ? 'mine' : 'theirs') + (isThreadStart ? '' : ' continued');

            const avatar = isThreadStart ? createAvatar(message.senderId, senderName) : document.createElement('div');
            if (!isThreadStart) {
                // avatar.className = 'message-avatar-spacer';
            }

            const bubble = document.createElement('div');
            bubble.className = 'message-bubble ' + (isMine ? 'message-mine' : 'message-theirs');

            if (!isMine && isThreadStart) {
                const name = document.createElement('div');
                name.className = 'message-meta fw-bold';
                name.textContent = message.senderUsername;
                bubble.appendChild(name);
            }

            renderMessageBody(message, bubble);

            if (isMine) {
                wrapper.appendChild(bubble);
                wrapper.appendChild(avatar);
            } else {
                wrapper.appendChild(avatar);
                wrapper.appendChild(bubble);
            }

            container.appendChild(wrapper);
            container.scrollTop = container.scrollHeight;
            lastRenderedSenderId = message.senderId;
        }

        // Send message
        document.getElementById('sendBtn').addEventListener('click', sendMessage);
        document.getElementById('messageInput').addEventListener('keydown', e => {
            if (e.key === 'Enter') sendMessage();
        });

        uploadImageBtn.addEventListener('click', uploadImageMessage);
        addFriendBtn.addEventListener('click', sendFriendRequest);

        const friendRequestMessageInput = document.getElementById('friendRequestMessage');
        if (friendRequestMessageInput) {
            friendRequestMessageInput.addEventListener('keydown', e => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    sendFriendRequest();
                }
            });
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const content = input.value.trim();
            if (!content || !selectedUserId || !friendIds.has(selectedUserId)) return;

            stompClient.send('/app/chat.send', {}, JSON.stringify({
                recipientId: selectedUserId,
                content: content
            }));

            input.value = '';
        }

        function uploadImageMessage() {
            const file = imageInput.files[0];
            if (!file || !selectedUserId || !friendIds.has(selectedUserId)) {
                return;
            }

            const formData = new FormData();
            formData.append('recipientId', selectedUserId);
            formData.append('file', file);

            uploadImageBtn.disabled = true;

            fetch('/api/messages/image', {
                method: 'POST',
                body: formData
            })
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Image upload failed');
                    }
                    return response.json();
                })
                .then(() => {
                    imageInput.value = '';
                })
                .catch(() => {
                    alert('Could not send the image. Please try again.');
                })
                .finally(() => {
                    uploadImageBtn.disabled = !selectedUserId || !friendIds.has(selectedUserId);
                });
        }

        function sendFriendRequest() {
            if (!selectedUserId || friendIds.has(selectedUserId) || currentFriendRequestStatus === 'pending') {
                return;
            }

            addFriendBtn.disabled = true;
            addFriendBtn.textContent = 'Sending...';

            const messageInput = document.getElementById('friendRequestMessage');
            const messageText = messageInput ? messageInput.value.trim() : '';

            fetch('/api/friend-requests/send/' + encodeURIComponent(selectedUserId), {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    [document.querySelector('meta[name="_csrf_header"]') ? document.querySelector('meta[name="_csrf_header"]').content : 'X-CSRF-TOKEN']: document.querySelector('meta[name="_csrf"]') ? document.querySelector('meta[name="_csrf"]').content : ''
                },
                body: JSON.stringify({ message: messageText })
            })
                .then(async response => {
                    const payload = await response.json().catch(() => ({}));
                    if (!response.ok) {
                        throw new Error(payload.error || 'Could not send friend request');
                    }

                    if (payload.status === 'ACCEPTED') {
                        friendIds.add(selectedUserId);
                        outgoingPendingRequests.delete(selectedUserId);
                        renderOutgoingPendingRequests();
                        currentFriendRequestStatus = null;
                        renderSelectionState();
                        loadConversationForSelectedUser();
                        return;
                    }

                    outgoingPendingRequests.set(selectedUserId, payload);
                    renderOutgoingPendingRequests();
                    currentFriendRequestStatus = 'pending';
                    friendRequestStatus.textContent = 'Friend request sent';
                    renderSelectionState();
                })
                .catch(error => {
                    currentFriendRequestStatus = null;
                    friendRequestStatus.textContent = '';
                    addFriendBtn.disabled = false;
                    addFriendBtn.textContent = 'Add friend';
                    alert(error.message || 'Could not send friend request.');
                });
        }

        const userSearchBtn = document.getElementById('userSearchBtn');
        const userSearchInput = document.getElementById('userSearchInput');
        const searchResults = document.getElementById('searchResults');

        if (userSearchBtn) {
            userSearchBtn.addEventListener('click', () => {
                const query = userSearchInput.value.trim();
                if (!query) return;

                fetch('/api/users/search?username=' + encodeURIComponent(query))
                    .then(res => res.json())
                    .then(users => {
                        searchResults.innerHTML = '';
                        if (users.length === 0) {
                            searchResults.innerHTML = '<div class="p-3 text-muted text-center">No users found.</div>';
                            return;
                        }
                        users.forEach(user => {
                            const item = document.createElement('a');
                            item.href = '#';
                            item.className = 'list-group-item list-group-item-action';
                            item.textContent = user.username;
                            item.addEventListener('click', (e) => {
                                e.preventDefault();
                                e.stopPropagation();
                                // Add to sidebar and select
                                addUserToSidebar(user);
                                const sidebarItem = document.querySelector('.user-list-item[data-userid="' + user.userId + '"]');
                                if (sidebarItem) {
                                    selectUser(sidebarItem);
                                }
                                bootstrap.Modal.getInstance(document.getElementById('searchUserModal')).hide();
                            });
                            searchResults.appendChild(item);
                        });
                    });
            });
            userSearchInput.addEventListener('keydown', e => {
                if (e.key === 'Enter') userSearchBtn.click();
            });
        }

        function formatMessageTime(timestamp) {
            if (!timestamp) return '';
            try {
                const date = new Date(timestamp);
                return date.toLocaleString();
            } catch (e) {
                return timestamp;
            }
        }

        function openMessageModal(message) {
            const modalContent = document.getElementById('modalMessageContent');
            const modalMeta = document.getElementById('modalMessageMeta');
            const isImageMessage = message.messageType === 'IMAGE' || !!message.mediaUrl;
            const isMine = message.senderId === currentUserId;

            // Clear previous content
            modalContent.innerHTML = '';
            modalMeta.innerHTML = '';

            // Display message content
            if (isImageMessage) {
                const image = document.createElement('img');
                image.className = 'modal-message-image';
                image.src = message.mediaUrl || createMediaUrl(message.mediaKey);
                image.alt = 'Chat image';
                modalContent.appendChild(image);
            } else {
                const text = document.createElement('div');
                text.className = 'modal-message-text';
                text.textContent = message.content || '';
                modalContent.appendChild(text);
            }

            // Display metadata
            const senderName = isMine ? 'You' : message.senderUsername;
            const timeStr = formatMessageTime(message.timestamp);
            modalMeta.innerHTML = `<strong>${senderName}</strong> • ${timeStr}`;

            // Show modal
            const modal = new bootstrap.Modal(document.getElementById('messageModal'));
            modal.show();
        }

        connect();
    </script>

</body>
